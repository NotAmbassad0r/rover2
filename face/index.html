<!DOCTYPE html><!-- ROVER Face PWA v1.0 — Samsung Galaxy A32 emotional display -->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>ROVER</title>
<link rel="manifest" href="/face/manifest.json"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e6edf3;
  font-family:'Courier New',Courier,monospace;user-select:none}
canvas{display:block;image-rendering:pixelated}
#ui{position:fixed;bottom:0;left:0;right:0;display:flex;flex-direction:column;
  align-items:center;gap:0;padding-bottom:env(safe-area-inset-bottom,16px);
  background:linear-gradient(transparent,rgba(0,0,0,.92) 30%)}
#status-bar{width:100%;display:flex;justify-content:space-between;
  padding:6px 16px 2px;font-size:11px;color:#8b949e;letter-spacing:.06em}
#status-bar span{display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;background:#30363d;flex-shrink:0}
.dot.ok{background:#3fb950}.dot.warn{background:#d29922}.dot.err{background:#f85149}
#mode-label{font-size:13px;letter-spacing:.12em;color:#8b949e;padding:2px 0 6px}
#chat-bubble{max-width:340px;width:90%;min-height:36px;background:rgba(22,27,34,.9);
  border:1px solid #30363d;border-radius:12px;padding:10px 14px;font-size:13px;
  line-height:1.5;margin-bottom:8px;text-align:center;
  display:none;white-space:pre-wrap}
#chat-bubble.user{color:#58a6ff;border-color:#1f6feb}
#chat-bubble.rover{color:#e6edf3;border-color:#3fb950}
#btn-row{display:flex;gap:12px;margin-bottom:10px}
.btn{padding:10px 22px;border-radius:8px;border:1px solid #30363d;
  background:rgba(22,27,34,.8);color:#e6edf3;font-family:inherit;font-size:13px;
  letter-spacing:.08em;cursor:pointer;transition:background .1s,border-color .1s}
.btn:active{background:rgba(48,54,61,.9)}
.btn.recording{background:rgba(248,81,73,.2);border-color:#f85149;color:#f85149}
.btn.audio-active{background:rgba(63,185,80,.15);border-color:#3fb950}
#btn-audio-route{font-size:11px;padding:8px 14px}
#alert-bar{width:100%;padding:4px 16px;font-size:11px;color:#d29922;
  text-align:center;min-height:18px;letter-spacing:.05em}
/* DEBUG OVERLAY */
#dbg-panel{position:fixed;top:0;left:0;z-index:9999;
  background:rgba(0,0,0,.75);padding:4px 8px 5px;cursor:pointer;
  font-size:9px;line-height:1.75;color:#fff;
  font-family:'Courier New',Courier,monospace}
.dbg-row{display:flex;gap:6px}
.dbg-key{color:#8b949e;min-width:34px;flex-shrink:0}
</style>
</head>
<body>
<canvas id="face"></canvas>

<div id="dbg-panel" onclick="dbgToggle()">
  <div class="dbg-row"><span class="dbg-key">MIC</span><span id="dbg-mic">pending</span></div>
  <div class="dbg-row"><span class="dbg-key">LEVEL</span><span id="dbg-level">0.000</span></div>
  <div class="dbg-row"><span class="dbg-key">VAD</span><span id="dbg-vad">idle</span></div>
  <div class="dbg-row"><span class="dbg-key">SESSION</span><span id="dbg-session">inactive</span></div>
  <div class="dbg-row"><span class="dbg-key">LAST</span><span id="dbg-last">—</span></div>
  <div class="dbg-row"><span class="dbg-key">ROUTED</span><span id="dbg-routed">—</span></div>
  <div class="dbg-row"><span class="dbg-key">WSS</span><span id="dbg-wss">disconnected</span></div>
</div>

<div id="ui">
  <div id="alert-bar"></div>
  <div id="status-bar">
    <span><span class="dot" id="dot-ws"></span>WS</span>
    <span><span class="dot" id="dot-serial"></span>SERIAL</span>
    <span><span class="dot" id="dot-follow"></span>FOLLOW</span>
    <span><span class="dot" id="dot-person"></span>PERSON</span>
    <span id="uptime-txt">—</span>
  </div>
  <div id="mode-label">IDLE</div>
  <div id="chat-bubble"></div>
  <div id="btn-row">
    <button class="btn" id="btn-mic" onclick="toggleVoice()">MIC</button>
    <button class="btn" id="btn-audio-route" onclick="toggleAudioRoute()">ROVER A32</button>
  </div>
</div>

<script>
'use strict';

// ── Config ──────────────────────────────────────────────────────────────────
const USE_WEB_SPEECH = true;  // false = use Pi Piper TTS (legacy)
const PI_HOST   = '192.168.250.254';
const PI_PORT   = 8082;
const API_BASE  = `https://${PI_HOST}:${PI_PORT}`;
const WS_URL    = `wss://${PI_HOST}:${PI_PORT}/ws`;
const WSA_URL   = `wss://${PI_HOST}:${PI_PORT}/ws/audio`;

// ── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('face');
const ctx    = canvas.getContext('2d');

let W, H, SCALE;
function resizeCanvas() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  SCALE = Math.max(6, Math.floor(W / 24));
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ── Face state machine ───────────────────────────────────────────────────────
const STATE = {IDLE:'idle',DETECT:'detect',FOLLOW:'follow',SEARCH:'search',
               BLOCK:'block',SPEAK:'speak',ALERT:'alert',OFFLINE:'offline'};

let faceState   = STATE.IDLE;   // start IDLE; only go OFFLINE on WS disconnect
let prevState   = STATE.OFFLINE;
let _stateAt    = 0;
let _personDir  = 0;   // -1=left, 0=center, 1=right — drives pupil
let _speakUntil = 0;   // monotonic ms
let _alertMsg   = '';

function setState(s) {
  if (s === faceState) return;
  prevState  = faceState;
  faceState  = s;
  _stateAt   = Date.now();
}

// ── Voxel face renderer ──────────────────────────────────────────────────────
// Coordinate system: voxel grid anchored at canvas center
// Face dimensions in voxels (SCALE px each):
const FACE_W = 14;   // face width in voxels
const FACE_H = 18;   // face height in voxels

// Colors
const C = {
  bg:       '#000008',
  face:     '#0d101a',
  face_hl:  '#141824',
  eye_bg:   '#111828',
  iris_idle:   '#2d6ea8',
  iris_detect: '#3a8fc8',
  iris_follow: '#2ea043',
  iris_search: '#d29922',
  iris_block:  '#f85149',
  iris_speak:  '#4a9eda',
  iris_alert:  '#f85149',
  iris_off:    '#21262d',
  pupil:    '#000008',
  mouth:    '#0d1820',
  mouth_hi: '#1f3048',
};

// Blink animation
let _blinkT = 0;
let _blinkOpen = 1.0;   // 0=closed, 1=open
let _nextBlink = 4000;
let _blinkStart = 0;
const BLINK_DUR = 140;

// Pupil animation
let _pupilX = 0, _pupilY = 0;   // offset in voxels, lerped
let _targetPX = 0, _targetPY = 0;
let _scanDir = 1, _scanT = 0;

// Mouth animation for speak state
let _mouthPhase = 0;

function _irisColor() {
  switch (faceState) {
    case STATE.DETECT:   return C.iris_detect;
    case STATE.FOLLOW:   return C.iris_follow;
    case STATE.SEARCH:   return C.iris_search;
    case STATE.BLOCK:    return C.iris_block;
    case STATE.SPEAK:    return C.iris_speak;
    case STATE.ALERT:    return C.iris_alert;
    case STATE.OFFLINE:  return C.iris_off;
    default:             return C.iris_idle;
  }
}

function _drawBlock(x, y, w, h, color, alpha) {
  if (alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  const px = x * SCALE, py = y * SCALE;
  ctx.fillRect(px, py, w * SCALE - 1, h * SCALE - 1);
  if (alpha !== undefined && alpha < 1) ctx.globalAlpha = 1;
}

function _drawFace(now) {
  // Face center in voxel coords
  const cx = Math.floor(W / SCALE / 2);
  const cy = Math.floor(H / SCALE / 2) - 2;
  const fx = cx - Math.floor(FACE_W / 2);
  const fy = cy - Math.floor(FACE_H / 2);

  // ── Background ──
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  // ── Face plate ──
  _drawBlock(fx + 1, fy + 1, FACE_W - 2, FACE_H - 2, C.face);
  // subtle highlight edge
  _drawBlock(fx + 1, fy + 1, FACE_W - 2, 1, C.face_hl);

  // ── Eyes ──
  const EYE_W = 4, EYE_H_MAX = 5;
  const eyeLx = fx + 1, eyeRx = fx + FACE_W - 1 - EYE_W;
  const eyeY  = fy + 4;

  // Blink: eye height shrinks to 0 during blink
  let eyeH = EYE_H_MAX;
  if (faceState === STATE.OFFLINE) {
    eyeH = 1;
  } else if (faceState === STATE.BLOCK) {
    eyeH = EYE_H_MAX;
  } else if (faceState === STATE.SEARCH) {
    eyeH = 3;
  }
  eyeH = Math.round(eyeH * _blinkOpen);
  if (eyeH < 1) eyeH = 1;

  const irisColor = _irisColor();
  // Left eye
  _drawBlock(eyeLx, eyeY, EYE_W, eyeH, C.eye_bg);
  if (faceState !== STATE.OFFLINE) {
    // Iris (2×2 voxels, can shift)
    const ipx = Math.round(Math.max(0, Math.min(EYE_W - 2, 1 + _pupilX)));
    const ipy = Math.round(Math.max(0, Math.min(eyeH - 2, Math.floor(eyeH / 2) - 1 + _pupilY)));
    _drawBlock(eyeLx + ipx, eyeY + ipy, 2, Math.min(2, eyeH), irisColor);
    // Pupil (1×1 center of iris)
    _drawBlock(eyeLx + ipx, eyeY + ipy, 1, 1, C.pupil);
    // Specular highlight
    _drawBlock(eyeLx + ipx + 1, eyeY + ipy, 1, 1, C.pupil);
  }

  // Right eye
  _drawBlock(eyeRx, eyeY, EYE_W, eyeH, C.eye_bg);
  if (faceState !== STATE.OFFLINE) {
    const ipx = Math.round(Math.max(0, Math.min(EYE_W - 2, 1 - _pupilX)));
    const ipy = Math.round(Math.max(0, Math.min(eyeH - 2, Math.floor(eyeH / 2) - 1 + _pupilY)));
    _drawBlock(eyeRx + ipx, eyeY + ipy, 2, Math.min(2, eyeH), irisColor);
    _drawBlock(eyeRx + ipx, eyeY + ipy, 1, 1, C.pupil);
    _drawBlock(eyeRx + ipx + 1, eyeY + ipy, 1, 1, C.pupil);
  }

  // ── Eyebrows ──
  if (faceState !== STATE.OFFLINE) {
    const browY = eyeY - 2;
    if (faceState === STATE.BLOCK || faceState === STATE.ALERT) {
      // V shape — worried
      _drawBlock(eyeLx,          browY + 1, 2, 1, irisColor, .6);
      _drawBlock(eyeLx + 2,      browY,     2, 1, irisColor, .6);
      _drawBlock(eyeRx,          browY,     2, 1, irisColor, .6);
      _drawBlock(eyeRx + 2,      browY + 1, 2, 1, irisColor, .6);
    } else if (faceState === STATE.FOLLOW) {
      // Raised slight — happy
      _drawBlock(eyeLx,     browY, EYE_W, 1, irisColor, .4);
      _drawBlock(eyeRx,     browY, EYE_W, 1, irisColor, .4);
    } else {
      // Flat neutral
      _drawBlock(eyeLx,     browY + 1, EYE_W, 1, C.eye_bg);
      _drawBlock(eyeRx,     browY + 1, EYE_W, 1, C.eye_bg);
    }
  }

  // ── Mouth ──
  const mouthY = fy + 12;
  const mouthX = fx + 2;
  const mouthW = FACE_W - 4;

  if (faceState === STATE.OFFLINE) {
    // Single dim line
    _drawBlock(mouthX, mouthY, mouthW, 1, C.mouth);
  } else if (faceState === STATE.FOLLOW) {
    // Smile — curved up at ends
    _drawBlock(mouthX,         mouthY + 1, 2,         1, C.mouth_hi);
    _drawBlock(mouthX + 2,     mouthY,     mouthW - 4, 1, C.mouth_hi);
    _drawBlock(mouthX + mouthW - 2, mouthY + 1, 2,     1, C.mouth_hi);
  } else if (faceState === STATE.SEARCH || faceState === STATE.ALERT) {
    // Frown — curved down at ends
    _drawBlock(mouthX,         mouthY,     2,          1, C.mouth_hi);
    _drawBlock(mouthX + 2,     mouthY + 1, mouthW - 4, 1, C.mouth_hi);
    _drawBlock(mouthX + mouthW - 2, mouthY, 2,          1, C.mouth_hi);
  } else if (faceState === STATE.BLOCK) {
    // Open O
    _drawBlock(mouthX + 1, mouthY,     mouthW - 2, 1, C.mouth_hi);
    _drawBlock(mouthX,     mouthY + 1, 1,          2, C.mouth_hi);
    _drawBlock(mouthX + mouthW - 1, mouthY + 1, 1, 2, C.mouth_hi);
    _drawBlock(mouthX + 1, mouthY + 3, mouthW - 2, 1, C.mouth_hi);
  } else if (faceState === STATE.SPEAK) {
    // Talking — animated open/close
    const phase = _mouthPhase;
    const openH = Math.round(1 + 2 * Math.abs(Math.sin(phase)));
    _drawBlock(mouthX,     mouthY,     mouthW, 1,     C.mouth_hi);
    if (openH > 1) {
      _drawBlock(mouthX,     mouthY + 1, 1,     openH - 1, C.mouth_hi);
      _drawBlock(mouthX + mouthW - 1, mouthY + 1, 1, openH - 1, C.mouth_hi);
    }
    if (openH > 2) {
      _drawBlock(mouthX + 1, mouthY + openH, mouthW - 2, 1, C.mouth_hi);
    }
  } else {
    // Neutral — flat line
    _drawBlock(mouthX, mouthY, mouthW, 1, C.mouth_hi);
  }

  // ── Nose (subtle 2-dot) ──
  if (faceState !== STATE.OFFLINE) {
    const noseY = fy + 9;
    _drawBlock(cx - 1, noseY, 1, 1, C.eye_bg);
    _drawBlock(cx + 1, noseY, 1, 1, C.eye_bg);
  }

  // ── Status text (bottom-centre) ──
  if (_statusText) {
    ctx.save();
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = irisColor;
    ctx.font = '11px monospace';
    ctx.letterSpacing = '3px';
    ctx.textAlign = 'center';
    ctx.fillText(_statusText, W / 2, H - 30);
    ctx.restore();
  }
}

// ── Animation loop ──────────────────────────────────────────────────────────
let _lastFrame = 0;

function _animate(now) {
  requestAnimationFrame(_animate);
  const dt = now - _lastFrame;
  _lastFrame = now;

  // Blink
  const shouldBlink = faceState !== STATE.OFFLINE && faceState !== STATE.BLOCK;
  if (shouldBlink) {
    _blinkT += dt;
    if (_blinkStart === 0 && _blinkT > _nextBlink) {
      _blinkStart = now;
      _nextBlink = 3000 + Math.random() * 4000;
      _blinkT = 0;
    }
    if (_blinkStart > 0) {
      const elapsed = now - _blinkStart;
      if (elapsed < BLINK_DUR / 2) {
        _blinkOpen = 1 - elapsed / (BLINK_DUR / 2);
      } else if (elapsed < BLINK_DUR) {
        _blinkOpen = (elapsed - BLINK_DUR / 2) / (BLINK_DUR / 2);
      } else {
        _blinkOpen = 1;
        _blinkStart = 0;
      }
    }
  } else {
    _blinkOpen = 1;
    _blinkStart = 0;
  }

  // Pupil movement
  if (faceState === STATE.FOLLOW) {
    _targetPX = _personDir * 1.5;
    _targetPY = 0;
  } else if (faceState === STATE.SEARCH) {
    _scanT += dt;
    if (_scanT > 900) { _scanDir *= -1; _scanT = 0; }
    _targetPX = _scanDir * 1.5;
    _targetPY = 0;
  } else if (faceState === STATE.IDLE || faceState === STATE.DETECT) {
    _scanT += dt;
    if (_scanT > 3000 + Math.random() * 2000) {
      _targetPX = (Math.random() - .5) * 1.5;
      _targetPY = (Math.random() - .5) * 0.8;
      _scanT = 0;
    }
  } else {
    _targetPX = 0;
    _targetPY = 0;
  }
  const lf = Math.min(1, dt * 0.006);
  _pupilX += (_targetPX - _pupilX) * lf;
  _pupilY += (_targetPY - _pupilY) * lf;

  // Mouth speak animation
  if (faceState === STATE.SPEAK) {
    _mouthPhase += dt * 0.012;
  } else {
    _mouthPhase = 0;
  }

  _drawFace(now);
}
requestAnimationFrame(_animate);

// ── WebSocket telemetry ──────────────────────────────────────────────────────
let _ws = null;
let _wsReconnectTimer = null;
let _lastTelemetry = null;

function _updateDots(connected) {
  document.getElementById('dot-ws').className = 'dot ' + (connected ? 'ok' : 'err');
}

function _applyTelemetry(d) {
  _lastTelemetry = d;
  // Dots
  document.getElementById('dot-serial').className = 'dot ' + (d.serial_connected ? 'ok' : 'err');
  document.getElementById('dot-follow').className  = 'dot ' + (d.tracking_enabled ? 'ok' : d.tracking_detect_only ? 'warn' : '');
  document.getElementById('dot-person').className  = 'dot ' + (d.person_detected ? 'ok' : '');

  // Uptime
  if (d.uptime_s != null) {
    const h = Math.floor(d.uptime_s / 3600), m = Math.floor((d.uptime_s % 3600) / 60);
    document.getElementById('uptime-txt').textContent =
      (h ? h + 'h ' : '') + m + 'm';
  }

  // Face state — priority order (highest first)
  const alerts = d.alerts || [];
  const hasCrit = alerts.some(a => a && a.severity === 'crit');
  const guardState = d.guard_state || 'DISARMED';

  let newState = STATE.IDLE;
  if (!d.serial_connected) {
    newState = STATE.OFFLINE;
  } else if (hasCrit || guardState === 'ALERT') {
    // System critical alert OR guard intruder alert → CRITICAL expression
    newState = STATE.ALERT;
  } else if (guardState === 'ARMED' || guardState === 'ARMING') {
    // Guard watching the door — scanning expression
    newState = STATE.SEARCH;
  } else if (d.forward_blocked) {
    newState = STATE.BLOCK;
  } else if (d.tracking_enabled) {
    newState = d.person_detected ? STATE.FOLLOW : STATE.SEARCH;
    if (d.person_detected) {
      _personDir = 0;
    }
  } else if (d.tracking_detect_only) {
    newState = STATE.DETECT;
  } else {
    newState = STATE.IDLE;
  }

  // Voice conversation active — show SPEAK (talking) or SEARCH (listening)
  if (d.conversation_active) {
    if (Date.now() < _speakUntil) {
      newState = STATE.SPEAK;   // ROVER is talking — animated mouth
    } else if (newState !== STATE.BLOCK && newState !== STATE.ALERT) {
      newState = STATE.SEARCH;  // ROVER is listening — scanning pupils
    }
  }

  // Don't interrupt speaking
  if (Date.now() < _speakUntil && newState !== STATE.BLOCK) {
    newState = STATE.SPEAK;
  }

  setState(newState);
  _updateStatusText();

  // Mode label
  const labels = {idle:'IDLE',detect:'DETECT',follow:'FOLLOW',search:'SEARCHING',
                  block:'STOP',speak:'SPEAKING',alert:'ALERT!',offline:'OFFLINE'};
  document.getElementById('mode-label').textContent = labels[newState] || newState.toUpperCase();

  // Audio mode button
  const mode = d.audio_mode || '';
  const btn = document.getElementById('btn-audio-route');
  btn.textContent = mode === 'ROVER_A32' ? 'A32 ✓' : mode === 'BUDS' ? 'BUDS' : 'ROUTE';
  btn.classList.toggle('audio-active', mode === 'ROVER_A32');

  // Alerts bar
  if (alerts.length > 0) {
    const msg = alerts[alerts.length - 1].msg || '';
    _alertMsg = msg.length > 60 ? msg.slice(0, 57) + '…' : msg;
  } else {
    _alertMsg = '';
  }
  document.getElementById('alert-bar').textContent = _alertMsg;
}

function _connectWS() {
  if (_ws && _ws.readyState <= 1) return;
  _ws = new WebSocket(WS_URL);
  _ws.onopen  = () => { _updateDots(true); clearTimeout(_wsReconnectTimer); setState(STATE.IDLE); _updateStatusText(); _dbg.wss = 'connected'; _dbgUpdate(); };
  _ws.onclose = () => {
    _updateDots(false);
    setState(STATE.OFFLINE);
    _updateStatusText();
    _dbg.wss = 'disconnected'; _dbgUpdate();
    _wsReconnectTimer = setTimeout(_connectWS, 3000);
  };
  _ws.onerror = () => {};
  _ws.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'telemetry') _applyTelemetry(d);
    } catch (_) {}
  };

  // Keepalive ping
  setInterval(() => {
    if (_ws && _ws.readyState === 1) {
      _ws.send(JSON.stringify({ type: 'ping' }));
    }
  }, 5000);
}
_connectWS();

// ── WebSocket audio (receive PCM frames from Pi proactive speech) ─────────
let _wsAudio = null;
let _audioCtx = null;
let _nextPlayTime  = 0;
let _speakerForced = false;  // true after silent-buffer trick has run once

function _getAudioCtx() {
  if (!_audioCtx) {
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: 16000,
      latencyHint: 'interactive',  // lower latency + keeps speaker focus on Android
    });
  }
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  // Play a 1-sample silent buffer on first call — forces Android to open the speaker
  // audio path before MINIMIC1 TRRS routing can redirect TTS output to the headset.
  // setSinkId is unreliable on Android Chrome; the silent-buffer approach is the
  // reliable way to lock the destination to the main speaker.
  if (!_speakerForced) {
    _speakerForced = true;
    try {
      const silentBuf = _audioCtx.createBuffer(1, 1, 16000);
      const silentSrc = _audioCtx.createBufferSource();
      silentSrc.buffer = silentBuf;
      silentSrc.connect(_audioCtx.destination);
      silentSrc.start();
    } catch (_) {}
  }
  return _audioCtx;
}

function _playPcmFrame(arrayBuffer) {
  try {
    const ac = _getAudioCtx();
    const int16 = new Int16Array(arrayBuffer);
    const f32   = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 32768;
    const audioBuf = ac.createBuffer(1, f32.length, 16000);
    audioBuf.copyToChannel(f32, 0);
    const src = ac.createBufferSource();
    src.buffer = audioBuf;
    src.connect(ac.destination);
    const now = ac.currentTime;
    const start = Math.max(now, _nextPlayTime);
    src.start(start);
    _nextPlayTime = start + audioBuf.duration;
    // Mark as speaking
    _speakUntil = Date.now() + Math.ceil(audioBuf.duration * 1000) + 200;
    setState(STATE.SPEAK);
    _voiceState = 'speaking'; _updateStatusText();
    src.onended = () => { _voiceState = 'idle'; _updateStatusText(); };
  } catch (e) {
    console.warn('PCM playback error', e);
  }
}

function _connectAudioWS() {
  if (_wsAudio && _wsAudio.readyState <= 1) return;
  _wsAudio = new WebSocket(WSA_URL);
  _wsAudio.binaryType = 'arraybuffer';
  _wsAudio.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) _playPcmFrame(e.data);
  };
  _wsAudio.onclose = () => setTimeout(_connectAudioWS, 4000);
  _wsAudio.onerror = () => {};
}
_connectAudioWS();

// ── Voice state ───────────────────────────────────────────────────────────────
let _speaking        = false;   // true while TTS utterance is active
let _conversation    = false;   // true while in a conversation session
let _convTurnCount   = 0;
let _convLoopActive  = false;   // prevents concurrent _convLoop invocations

// ── Canvas status text ────────────────────────────────────────────────────────
let _statusText = '';   // rendered on canvas bottom-centre; '' = hidden
let _voiceState = 'idle';  // 'idle' | 'listening' | 'thinking' | 'speaking'

function _updateStatusText() {
  // Voice states take priority over robot states
  if (_voiceState === 'listening') { _statusText = 'LISTENING...'; return; }
  if (_voiceState === 'thinking')  { _statusText = 'THINKING...';  return; }
  if (_voiceState === 'speaking')  { _statusText = 'SPEAKING';     return; }
  // Robot / face states
  switch (faceState) {
    case STATE.FOLLOW:   _statusText = 'FOLLOWING';         break;
    case STATE.SEARCH:   _statusText = 'SEARCHING';         break;
    case STATE.BLOCK:    _statusText = 'OBSTACLE DETECTED'; break;
    case STATE.ALERT:    _statusText = 'ALERT';             break;
    case STATE.DETECT:   _statusText = 'MOVING';            break;
    case STATE.OFFLINE:  _statusText = 'OFFLINE';           break;
    default:             _statusText = '';                  break;  // IDLE = clean face
  }
}

// Legacy MediaRecorder path (USE_WEB_SPEECH = false)
let _mediaRecorder = null;
let _audioChunks   = [];
let _recording     = false;
let _voicePending  = false;

function toggleVoice() {
  if (!USE_WEB_SPEECH) {
    // Legacy path — MediaRecorder + faster-whisper
    if (_recording) stopRecording(); else startRecording();
    return;
  }
  // Web Speech path — manual conversation trigger / abort
  if (_conversation) {
    _convEndRequest = true;   // signal the loop to end gracefully
  } else {
    _startConversation();
  }
}

let _convEndRequest = false;  // set true to abort active conversation loop

// Detect best supported audio format for this browser/device
function _bestMimeType() {
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4',
    'audio/ogg;codecs=opus',
    'audio/ogg',
  ];
  for (const t of candidates) {
    if (MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';  // let browser pick
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _dbg.mic = 'granted'; _dbg.vad = 'recording'; _dbgUpdate();
    const mimeType = _bestMimeType();
    _dbg.last = 'fmt:' + (mimeType || 'default'); _dbgUpdate();
    const opts = mimeType ? { mimeType } : {};
    _mediaRecorder = new MediaRecorder(stream, opts);
    const actualMime = _mediaRecorder.mimeType || mimeType;
    _audioChunks = [];
    _mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) _audioChunks.push(e.data); };
    _mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      _dbg.vad = 'processing'; _dbgUpdate();
      const blob = new Blob(_audioChunks, { type: actualMime });
      _audioChunks = [];
      await _sendVoice(blob, actualMime);
    };
    _mediaRecorder.start(200);
    _recording = true;
    document.getElementById('btn-mic').classList.add('recording');
    document.getElementById('btn-mic').textContent = '■ STOP';
  } catch (e) {
    _dbg.mic = e.name === 'NotAllowedError' ? 'denied' : 'error:' + e.name;
    _dbg.vad = 'idle'; _dbgUpdate();
    _showBubble('rover', 'Microphone unavailable: ' + e.message);
  }
}

function stopRecording() {
  if (!_recording || !_mediaRecorder) return;
  _recording = false;
  _mediaRecorder.stop();
  document.getElementById('btn-mic').classList.remove('recording');
  document.getElementById('btn-mic').textContent = 'MIC';
}

const _TIMEOUT_TRANSCRIBE_MS = 35000;
const _TIMEOUT_AGENT_MS      = 65000;
const _TIMEOUT_SPEAK_MS      = 35000;

// ── Web Speech TTS ───────────────────────────────────────────────────────────
// NOTE: Web Speech API handles agent voice responses (user-initiated).
// Piper handles proactive server-side events (PERSON_FOUND, THERMAL etc).
// This split offloads the majority of TTS work to the A32.

// Load voices — Android Chrome loads them async
let _voices_loaded = false;
function _ensureVoices() {
  if (!window.speechSynthesis) return Promise.resolve();
  return new Promise(resolve => {
    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) { _voices_loaded = true; resolve(); return; }
    window.speechSynthesis.onvoiceschanged = () => {
      _voices_loaded = true;
      resolve();
    };
    // Fallback timeout — proceed even if onvoiceschanged doesn't fire
    setTimeout(resolve, 2000);
  });
}

// Build a SpeechSynthesisUtterance with British English voice + standard params.
// Always create a fresh object — Android Chrome sometimes silently drops reused ones.
function _makeTtsUtterance(text) {
  const u = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices();
  const preferred = ['Google UK English Female', 'Google UK English Male', 'en-GB'];
  for (const pref of preferred) {
    const v = voices.find(vv => vv.name.includes(pref) || vv.lang === pref);
    if (v) { u.voice = v; break; }
  }
  u.lang   = 'en-GB';
  u.rate   = 0.88;   // slightly slower — deliberate, clipped delivery
  u.pitch  = 0.85;   // slightly lower — more authoritative
  u.volume = 1.0;
  return u;
}

function _ttsSpeak(text) {
  if (!window.speechSynthesis) { console.warn('Web Speech API not available'); return; }
  window.speechSynthesis.cancel();

  let started = false;

  function _speak() {
    const u = _makeTtsUtterance(text);
    u.onstart = () => {
      started = true;
      _speakUntil = Date.now() + 60000;
      setState(STATE.SPEAK);
      _voiceState = 'speaking'; _updateStatusText();
      _dbg.vad = 'speaking'; _dbgUpdate();
    };
    u.onend = () => {
      _speakUntil = 0;
      setState(faceState === STATE.SPEAK ? STATE.IDLE : faceState);
      _voiceState = 'idle'; _updateStatusText();
      _dbg.vad = 'idle'; _dbgUpdate();
    };
    u.onerror = (e) => {
      if (e.error === 'interrupted') return;  // cancelled for retry — ignore
      console.warn('TTS error:', e.error);
      _speakUntil = 0;
      _voiceState = 'idle'; _updateStatusText();
      _dbg.vad = 'idle'; _dbgUpdate();
    };
    window.speechSynthesis.speak(u);
  }

  _speak();
  // If onstart hasn't fired in 300 ms, Android probably dropped the call
  // (MINIMIC1 TRRS audio routing conflict) — cancel and retry once.
  setTimeout(() => { if (!started) { window.speechSynthesis.cancel(); _speak(); } }, 300);
}

// Async TTS — resolves when speech finishes (used in conversation loop)
function _ttsSpeakAsync(text) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis) { resolve(); return; }
    window.speechSynthesis.cancel();

    let started  = false;
    let resolved = false;
    const done = () => { if (!resolved) { resolved = true; resolve(); } };

    function _speak() {
      const u = _makeTtsUtterance(text);
      u.onstart = () => {
        started = true;
        _speaking = true;
        _speakUntil = Date.now() + 60000;
        setState(STATE.SPEAK);
        _voiceState = 'speaking'; _updateStatusText();
        _dbg.vad = 'speaking'; _dbgUpdate();
      };
      u.onend = () => {
        _speaking = false;
        _speakUntil = 0;
        setState(faceState === STATE.SPEAK ? STATE.IDLE : faceState);
        _voiceState = 'idle'; _updateStatusText();
        _dbg.vad = 'idle'; _dbgUpdate();
        done();
      };
      u.onerror = (e) => {
        if (e.error === 'interrupted') return;  // cancelled for retry — do not resolve yet
        _speaking = false;
        _speakUntil = 0;
        _voiceState = 'idle'; _updateStatusText();
        _dbg.vad = 'idle'; _dbgUpdate();
        done();
      };
      window.speechSynthesis.speak(u);
    }

    _speak();
    // If onstart hasn't fired in 300 ms, Android dropped the call — cancel and retry once.
    setTimeout(() => { if (!started && !resolved) { window.speechSynthesis.cancel(); _speak(); } }, 300);
  });
}

// ── VAD / wake word pipeline (fully local — no cloud STT) ────────────────────
// Wake mode: AnalyserNode RMS polling → 2.5 s chunk → /api/voice/wake (faster-whisper)
// Conversation mode: MediaRecorder → silence-gated chunks → /api/voice/transcribe

const WAKE_RMS_THRESHOLD = 0.015;  // energy floor to trigger wake recording
const CONV_RMS_THRESHOLD = 0.020;  // energy floor for conversation speech detection
const WAKE_CHUNK_S       = 2.5;    // seconds of audio per wake check
const CONV_MAX_S         = 12;     // max seconds per conversation turn
const CONV_SILENCE_MS    = 600;    // ms of silence (after speech starts) to end turn
const CONV_TIMEOUT_MS    = 10000;  // 10 s total conversation silence → end session

let _micStream = null;   // shared MediaStream (acquired once, reused for all recording)
let _analyser  = null;   // AnalyserNode connected to mic — used for RMS polling
let _vadActive = false;  // true while wake VAD poll loop is running

function _rmsLevel() {
  if (!_analyser) return 0;
  const buf = new Float32Array(_analyser.fftSize);
  _analyser.getFloatTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  return Math.sqrt(sum / buf.length);
}

// Returns a short human-readable label for the active mic track (for MIC row in overlay).
function _micDisplayLabel(stream) {
  const tracks = stream ? stream.getAudioTracks() : [];
  if (!tracks.length) return 'granted';
  const label = tracks[0].label || '';
  const short  = label.length > 22 ? label.slice(0, 20) + '…' : label;
  return short || 'built-in';
}

async function _startVoicePipeline() {
  // Stop any existing stream before requesting a new one (supports MINIMIC1 hot-swap).
  if (_micStream) {
    _micStream.getAudioTracks().forEach(t => t.stop());
    _micStream = null;
    _analyser  = null;
  }
  try {
    // No deviceId — let Android pick the wired mic automatically when MINIMIC1 is plugged in.
    // echoCancellation: false — MINIMIC1 is hardware-isolated; AEC hurts quality and blocks speaker.
    _micStream = await navigator.mediaDevices.getUserMedia({
      audio: { noiseSuppression: true, echoCancellation: false, autoGainControl: true }
    });
    _dbg.mic = _micDisplayLabel(_micStream); _dbgUpdate();
    const ac     = _getAudioCtx();
    const source = ac.createMediaStreamSource(_micStream);
    _analyser = ac.createAnalyser();
    _analyser.fftSize = 256;
    source.connect(_analyser);
    _startWakeVad();
  } catch (e) {
    _dbg.mic = e.name === 'NotAllowedError' ? 'denied' : 'error:' + e.name;
    _dbg.vad = 'mic unavailable'; _dbgUpdate();
  }
}

// Two-tone ascending chime played on confirmed wake word.
// Uses Web Audio API — no audio file needed, no new AudioContext if one exists.
// Tone 1: 880 Hz / 80 ms, Tone 2: 1320 Hz / 80 ms starting 70 ms after Tone 1.
// Gain envelope: 5 ms attack, 30 ms release on each tone to avoid clicks.
function _playWakeChime() {
  return new Promise(resolve => {
    try {
      const ac  = _getAudioCtx();
      const now = ac.currentTime;
      const playTone = (freq, offsetS, gainVal) => {
        const osc  = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ac.destination);
        const t0  = now + offsetS;
        const dur = 0.080;
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(gainVal, t0 + 0.005);  // 5 ms attack
        gain.gain.setValueAtTime(gainVal, t0 + dur - 0.030);
        gain.gain.linearRampToValueAtTime(0, t0 + dur);          // 30 ms release
        osc.start(t0);
        osc.stop(t0 + dur);
      };
      playTone(880,  0,     0.3);  // Tone 1: 880 Hz at t=0
      playTone(1320, 0.070, 0.3);  // Tone 2: 1320 Hz at t=70 ms
    } catch (_) {}
    // Resolve after both tones finish (70 ms + 80 ms = 150 ms + margin)
    setTimeout(resolve, 180);
  });
}

function _startWakeVad() {
  if (_conversation || _vadActive) return;
  _vadActive = true;
  _voiceState = 'listening'; _updateStatusText();
  _dbg.vad = 'listening for "rover"'; _dbgUpdate();

  const poll = async () => {
    while (_vadActive && !_conversation) {
      await new Promise(r => setTimeout(r, 80));
      if (_rmsLevel() >= WAKE_RMS_THRESHOLD) {
        _vadActive = false;
        _voiceState = 'thinking'; _updateStatusText();
        _dbg.vad = 'audio — checking wake…'; _dbgUpdate();
        const isWake = await _checkWakeWord();
        if (isWake && !_conversation) {
          await _playWakeChime();
          await _startConversation();
        } else {
          await new Promise(r => setTimeout(r, 400));  // brief cooldown before re-arm
          _startWakeVad();
        }
        return;
      }
    }
    _vadActive = false;
  };
  poll();
}

async function _recordWakeChunk() {
  return new Promise((resolve) => {
    if (!_micStream) {
      console.error('_recordWakeChunk: _micStream is null — mic not initialised');
      resolve(null); return;
    }
    const mimeType = _bestMimeType();
    const opts = mimeType ? { mimeType } : {};
    let rec;
    try { rec = new MediaRecorder(_micStream, opts); }
    catch (err) {
      console.error('_recordWakeChunk: MediaRecorder construction failed:', err);
      resolve(null); return;
    }
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = () => {
      if (!chunks.length) {
        console.error('_recordWakeChunk: onstop fired but chunks array is empty — no audio captured');
        resolve(null); return;
      }
      resolve(new Blob(chunks, { type: rec.mimeType || mimeType || 'audio/webm' }));
    };
    rec.start(200);
    setTimeout(() => {
      try { if (rec.state === 'recording') rec.stop(); }
      catch (err) { console.error('_recordWakeChunk: rec.stop() threw:', err); }
    }, WAKE_CHUNK_S * 1000);
  });
}

async function _checkWakeWord() {
  const blob = await _recordWakeChunk();
  if (!blob) {
    console.error('_checkWakeWord: _recordWakeChunk returned null — skipping POST');
    _dbg.vad = 'wake: no audio'; _dbgUpdate();
    return false;
  }
  try {
    const ext = (blob.type || '').includes('mp4') ? 'mp4'
              : (blob.type || '').includes('ogg') ? 'ogg' : 'webm';
    const fd = new FormData();
    fd.append('audio', blob, 'wake.' + ext);
    fd.append('lang', 'en');
    console.log('_checkWakeWord: POSTing', blob.size, 'bytes to /api/voice/wake');
    const resp = await fetch(API_BASE + '/api/voice/wake', { method: 'POST', body: fd });
    if (!resp.ok) {
      console.error('_checkWakeWord: /api/voice/wake returned HTTP', resp.status);
      return false;
    }
    const data = await resp.json();
    _dbg.last = 'wake: ' + (data.transcript || '—').slice(0, 18); _dbgUpdate();
    return data.wake === true;
  } catch (e) {
    console.error('_checkWakeWord: fetch /api/voice/wake failed:', e);
    return false;
  }
}

async function _recordConvTurn() {
  return new Promise((resolve) => {
    if (!_micStream) {
      console.error('_recordConvTurn: _micStream is null — mic not initialised');
      resolve(null); return;
    }
    const mimeType = _bestMimeType();
    const opts = mimeType ? { mimeType } : {};
    let rec;
    try { rec = new MediaRecorder(_micStream, opts); }
    catch (err) {
      console.error('_recordConvTurn: MediaRecorder construction failed:', err);
      resolve(null); return;
    }
    const chunks = [];
    let speechStarted = false;
    let silenceStart  = null;
    let done          = false;

    const stopRec = () => {
      if (done) return;
      done = true;
      clearInterval(vadInterval);
      clearTimeout(hardMax);
      try { if (rec.state === 'recording') rec.stop(); } catch (_) {}
    };

    const vadInterval = setInterval(() => {
      const rms = _rmsLevel();
      if (rms >= CONV_RMS_THRESHOLD) {
        speechStarted = true;
        silenceStart  = null;
      } else if (speechStarted) {
        if (silenceStart === null) silenceStart = Date.now();
        else if (Date.now() - silenceStart >= CONV_SILENCE_MS) stopRec();
      }
    }, 80);

    const hardMax = setTimeout(stopRec, CONV_MAX_S * 1000);

    rec.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = () => {
      if (!speechStarted || !chunks.length) { resolve(null); return; }
      resolve(new Blob(chunks, { type: rec.mimeType || mimeType || 'audio/webm' }));
    };
    rec.start(200);
  });
}

async function _startConversation() {
  if (_conversation) return;
  _conversation   = true;
  _convEndRequest = false;
  _convTurnCount  = 0;
  const sessionId = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(16));
  const history   = [];

  const btnMic = document.getElementById('btn-mic');
  btnMic.textContent = '■ END';
  btnMic.classList.add('recording');
  _dbg.session = 'active (0 turns)'; _dbg.vad = 'starting…'; _dbgUpdate();

  // Pause FOLLOW
  try {
    await fetch(API_BASE + '/api/tracking', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({enabled: false}),
    });
  } catch (_) {}

  await _ensureVoices();
  await _ttsSpeakAsync('Yes, sir.');
  await _convLoop(sessionId, history);
}

async function _convLoop(sessionId, history) {
  if (_convLoopActive) {
    console.warn('_convLoop: already active, ignoring duplicate call');
    return;
  }
  _convLoopActive = true;
  let convTimeoutHandle = null;

  const _end = async (phrase) => {
    _convLoopActive = false;  // release guard before any async work
    _conversation   = false;
    _convEndRequest = false;
    if (convTimeoutHandle) clearTimeout(convTimeoutHandle);
    _dbg.session = 'inactive'; _dbg.vad = 'ending…'; _dbgUpdate();
    try { window.speechSynthesis.cancel(); } catch (_) {}
    if (phrase) await _ttsSpeakAsync(phrase);
    try {
      await fetch(API_BASE + '/api/voice/converse/end', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({session_id: sessionId}),
      });
    } catch (_) {}
    const btnMic = document.getElementById('btn-mic');
    btnMic.textContent = 'MIC';
    btnMic.classList.remove('recording');
    _voiceState = 'idle'; _updateStatusText();
    _dbg.session = 'inactive'; _dbg.vad = 'idle'; _dbgUpdate();
    _startWakeVad();  // resume listening for wake word
  };

  const loop = async () => {
    if (!_conversation) return;  // abort if _end() was called externally (e.g. from timeout)
    if (_convEndRequest) { await _end('Very well, sir.'); return; }

    _voiceState = 'listening'; _updateStatusText();
    _dbg.vad = 'listening…'; _dbgUpdate();
    _showBubble('user', '…');

    // (Re-)arm the conversation timeout — 10 s total silence ends session
    if (convTimeoutHandle) clearTimeout(convTimeoutHandle);
    convTimeoutHandle = setTimeout(() => {
      if (_conversation) _end('Very well, sir.');
    }, CONV_TIMEOUT_MS);

    const blob = await _recordConvTurn();

    if (_convEndRequest) { await _end('Very well, sir.'); return; }

    if (!blob) {
      // No speech detected — keep waiting (timeout handles prolonged silence)
      loop();
      return;
    }

    clearTimeout(convTimeoutHandle);
    _voiceState = 'thinking'; _updateStatusText();
    _dbg.vad = 'transcribing…'; _dbgUpdate();

    // POST audio to faster-whisper on Pi — fully local, no cloud
    const ext = (blob.type || '').includes('mp4') ? 'mp4'
              : (blob.type || '').includes('ogg') ? 'ogg' : 'webm';
    const fd  = new FormData();
    fd.append('audio', blob, 'conv.' + ext);
    fd.append('lang', 'en');

    let transcript = '';
    try {
      const resp = await fetch(API_BASE + '/api/voice/transcribe', { method: 'POST', body: fd });
      if (resp.ok) {
        const data = await resp.json();
        transcript = (data.transcript || '').trim();
      }
    } catch (e) {
      _dbg.last = 'transcribe err: ' + (e.message || '').slice(0, 20); _dbgUpdate();
    }

    if (!transcript) {
      _dbg.last = 'empty transcript'; _dbgUpdate();
      loop();
      return;
    }

    if (_convEndRequest) { await _end('Very well, sir.'); return; }

    _convTurnCount++;
    _dbg.session = `active (${_convTurnCount} turn${_convTurnCount > 1 ? 's' : ''})`;
    _voiceState = 'thinking'; _updateStatusText();
    _dbg.vad = 'thinking…'; _dbg.last = transcript.slice(0, 30); _dbgUpdate();
    _showBubble('user', transcript);

    history.push({role: 'user', content: transcript});
    if (history.length > 12) history.splice(0, 2);  // max 6 pairs

    let reply = '', routedTo = 'hailo';
    try {
      const resp = await fetch(API_BASE + '/api/voice/converse', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          message:    transcript,
          history:    history.slice(0, -1),  // exclude current turn
          spoken:     true,
          lang:       'en',
          session_id: sessionId,
        }),
      });
      if (resp.ok) {
        const data = await resp.json();
        reply    = (data.reply || '').trim();
        routedTo = data.routed_to || 'hailo';
      }
    } catch (err) {
      _dbg.last = 'converse err: ' + (err.message || '').slice(0, 20); _dbgUpdate();
    }

    _dbg.routed = routedTo; _dbgUpdate();

    if (reply) {
      history.push({role: 'assistant', content: reply});
      if (history.length > 12) history.splice(0, 2);
      _showBubble('rover', reply);
      await _ttsSpeakAsync(reply);
    }

    if (_convEndRequest) { await _end('Very well, sir.'); return; }

    loop();  // next turn (recursive async — tail-call-like)
  };

  loop();
}

function _fetchWithTimeout(url, opts, timeoutMs) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), timeoutMs);
  return fetch(url, { ...opts, signal: ctrl.signal })
    .finally(() => clearTimeout(tid));
}

async function _sendVoice(blob, mimeType) {
  if (_voicePending) return;
  _voicePending = true;
  try {
    // 1. Transcribe
    const ext = mimeType.includes('mp4') ? 'mp4'
              : mimeType.includes('ogg')  ? 'ogg' : 'webm';
    const fd = new FormData();
    fd.append('audio', blob, 'voice.' + ext);
    fd.append('lang', 'en');
    _showBubble('user', '…');
    _dbg.last = 'transcribing…'; _dbgUpdate();

    let r1;
    try {
      r1 = await _fetchWithTimeout(
        API_BASE + '/api/voice/transcribe', { method: 'POST', body: fd },
        _TIMEOUT_TRANSCRIBE_MS
      );
    } catch (e) {
      _dbg.last = 'transcribe failed: ' + e.message.slice(0, 30); _dbgUpdate();
      // single retry after 2 s
      await new Promise(res => setTimeout(res, 2000));
      _dbg.last = 'transcribe retry…'; _dbgUpdate();
      try {
        r1 = await _fetchWithTimeout(
          API_BASE + '/api/voice/transcribe', { method: 'POST', body: fd },
          _TIMEOUT_TRANSCRIBE_MS
        );
      } catch (e2) {
        _dbg.last = 'transcribe err(retry): ' + e2.message.slice(0, 25); _dbgUpdate();
        _hideBubble(); _voicePending = false; return;
      }
    }

    const d1 = await r1.json();
    const transcript = (d1.transcript || '').trim();
    const detectedLang = d1.language || 'en';
    if (!transcript) {
      _dbg.last = d1.error ? 'stt err: ' + d1.error.slice(0, 30) : 'empty transcript'; _dbgUpdate();
      _hideBubble(); _voicePending = false; return;
    }
    _dbg.last = 'transcribed: ' + transcript.slice(0, 22); _dbgUpdate();
    _showBubble('user', transcript);

    // 2. Agent — spoken=true → ROVER personality
    const agentBody = JSON.stringify({ message: transcript, spoken: true, lang: detectedLang || 'en' });
    _dbg.last = 'sending to agent…'; _dbgUpdate();

    let agentResp;
    try {
      agentResp = await _fetchWithTimeout(
        API_BASE + '/api/agent/chat',
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: agentBody },
        _TIMEOUT_AGENT_MS
      );
    } catch (e) {
      _dbg.last = 'agent failed: ' + e.message.slice(0, 30); _dbgUpdate();
      await new Promise(res => setTimeout(res, 2000));
      _dbg.last = 'agent retry…'; _dbgUpdate();
      try {
        agentResp = await _fetchWithTimeout(
          API_BASE + '/api/agent/chat',
          { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: agentBody },
          _TIMEOUT_AGENT_MS
        );
      } catch (e2) {
        _dbg.last = 'agent err(retry): ' + e2.message.slice(0, 25); _dbgUpdate();
        _voicePending = false; return;
      }
    }
    if (!agentResp.ok) {
      _dbg.last = 'agent HTTP ' + agentResp.status; _dbgUpdate();
      _voicePending = false; return;
    }
    const d2 = await agentResp.json();
    const reply = (d2.reply || '').trim();
    if (!reply) { _voicePending = false; return; }
    _showBubble('rover', reply);

    // 3. TTS — Web Speech API (primary) or Pi Piper TTS (legacy fallback)
    _dbg.last = 'speaking…'; _dbgUpdate();
    if (USE_WEB_SPEECH) {
      await _ensureVoices();
      _ttsSpeak(reply);
    } else {
      // Legacy path — Pi Piper TTS via /api/voice/speak
      let r3;
      try {
        r3 = await _fetchWithTimeout(
          API_BASE + '/api/voice/speak',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: reply.slice(0, 500), lang: 'en' }),
          },
          _TIMEOUT_SPEAK_MS
        );
      } catch (e) {
        _dbg.last = 'speak failed: ' + e.message.slice(0, 30); _dbgUpdate();
        _voicePending = false; return;
      }
      if (r3.ok) {
        const wav = await r3.arrayBuffer();
        const ac  = _getAudioCtx();
        try {
          const decoded = await ac.decodeAudioData(wav);
          const src = ac.createBufferSource();
          src.buffer = decoded;
          src.connect(ac.destination);
          src.start();
          _speakUntil = Date.now() + Math.ceil(decoded.duration * 1000) + 200;
          setState(STATE.SPEAK);
          src.onended = () => setState(faceState === STATE.SPEAK ? STATE.IDLE : faceState);
        } catch (_) {}
      }
    }
  } catch (e) {
    _dbg.last = 'err: ' + e.message.slice(0, 38); _dbgUpdate();
    _showBubble('rover', 'Error: ' + e.message);
  } finally {
    _dbg.vad = 'idle'; _dbgUpdate();
    _voicePending = false;
  }
}

function _showBubble(cls, text) {
  const el = document.getElementById('chat-bubble');
  el.className = cls;
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(_bubbleTimer);
  _bubbleTimer = setTimeout(_hideBubble, 12000);
}

function _hideBubble() {
  document.getElementById('chat-bubble').style.display = 'none';
}
let _bubbleTimer = null;

// ── Audio routing toggle ────────────────────────────────────────────────────
async function toggleAudioRoute() {
  const current = (_lastTelemetry || {}).audio_mode || 'ROVER_A32';
  const next    = current === 'ROVER_A32' ? 'BUDS' : 'ROVER_A32';
  try {
    await fetch(API_BASE + '/api/audio/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: next }),
    });
  } catch (e) {
    _showBubble('rover', 'Route switch failed: ' + e.message);
  }
}

// ── Service worker registration ──────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/face/sw.js', { scope: '/face/' }).catch(() => {});
}

// Unlock audio context on first touch (mobile browser requirement)
document.addEventListener('touchstart', () => _getAudioCtx(), { once: true });

// ── Mic hot-swap — MINIMIC1 TRRS (event-driven, no polling) ─────────────────
// When MINIMIC1 is plugged / unplugged Android fires devicechange.
// Re-init the pipeline so getUserMedia picks the new default audio source.
// Guard: skip if mid-conversation (don't interrupt the agent).
if (navigator.mediaDevices) {
  navigator.mediaDevices.addEventListener('devicechange', async () => {
    if (!_micStream || _conversation) return;
    console.log('AudioSourceManager: devicechange — re-enumerating mic');
    _vadActive = false;  // stop current VAD loop; _startVoicePipeline restarts it
    await _startVoicePipeline();
  });
}

// ── Voice pipeline init ──────────────────────────────────────────────────────
// TTS: Web Speech API (local, on-device) for agent responses
// STT: MediaRecorder → faster-whisper on Pi (fully local, no cloud)
if (USE_WEB_SPEECH && window.speechSynthesis) {
  _ensureVoices();
  window.addEventListener('load', () => {
    // Silent utterance — pre-warms TTS engine on Android Chrome (3 s avoids boot contention)
    setTimeout(() => {
      const warmup = new SpeechSynthesisUtterance(' ');
      warmup.volume = 0;
      warmup.onend = () => console.log('TTS engine warmed up');
      window.speechSynthesis.speak(warmup);
    }, 3000);
    // Start VAD + local wake-word pipeline (no Google — uses faster-whisper on Pi)
    setTimeout(() => _startVoicePipeline(), 3500);
  });
}
</script>
