serial:
  port: /dev/ttyUSB0
  baudrate: 115200
  timeout_s: 1.0
  reconnect_interval_s: 5.0
  startup_detect_delay_s: 2.5

server:
  host: 0.0.0.0
  port: 8082

drive:
  default_speed: 120
  max_speed: 255
  # Arc turns: one wheel rolls, one stops — much less floor friction than pivot turns
  direction_map:
    forward: [1, -1]
    back: [-1, 1]
    left: [1, 0]
    right: [0, -1]

gripper:
  port: PORT4B

arm:
  port: PORT3B          # must match firmware rover2_basic.ino
  max_speed: 150        # PWM magnitude for hold-to-move
  invert: false         # set true if up/down are reversed

safety:
  enabled: true
  safe_distance_cm: 40
  poll_interval_s: 0.5
  initial_poll_delay_s: 1.0

ultrasonic:
  poll_interval_s: 0.5   # background poll on serial bridge

websocket:
  telemetry_interval_s: 0.4   # live status push to browser
  heartbeat_timeout_s: 10.0   # stop motors/follow if UI stops pinging (10s tolerates WiFi jitter)

camera:
  upstream_url: http://127.0.0.1:8081/stream
  snapshot_url: http://127.0.0.1:8081/snapshot
  health_url: http://127.0.0.1:8081/health

body_tracker:
  enabled: true
  camera_url: http://127.0.0.1:8081/stream   # rover-camera.service (v1 path OK)
  hef_path: /opt/rover/models/yolov8m_h10.hef
  hailo_group_id: rover2
  confidence: 0.40
  centre_zone: 0.30
  target_bbox_width: 0.35
  turn_speed: 210
  forward_speed: 170
  frame_interval_s: 0.5    # 2fps inference — stream read at full rate but imdecode skipped between frames
  hailo_warmup_s: 30.0     # delay before loading Hailo model — lets CPU idle after boot
  ble_follow_enabled: false # BLE fallback off by default — enable via UI BLE button
  detect_only_on_start: true # watch for people on boot; rover does NOT follow until explicitly enabled
  avoid_default: left   # when wall blocks FWD and person is centred in frame

ble_tracker:
  enabled: true        # set false for office demo (no BLE, saves CPU + heat)
                       # set true for home use (guard mode arm/disarm via beacon)
  device_name: "-Lars's Z flip 6"
  device_mac: "F0:05:1B:0A:E0:4C"
  beacon_uuid: "0000fcf1-0000-1000-8000-00805f9b34fb"
  rssi_track: -75      # advance when signal stronger than this
  rssi_close: -60      # hold when very close
  search_speed: 50
  fwd_speed: 60

agent:
  enabled: true
  # backend: hailo = LLM on AI HAT+ (hailo-ollama) | tools_only = Pi bridge/tools only (no CPU LLM)
  #         cpu = legacy Pi CPU ollama.service (high load — avoid on robot)
  backend: hailo
  ollama_base: http://127.0.0.1:11434        # CPU ollama — fallback only
  hailo_ollama_base: http://127.0.0.1:8000   # hailo-ollama on AI HAT+ (port 8000)
  model: llama3.2:1b                         # CPU ollama model (fallback)
  hailo_model: qwen2.5-instruct:1.5b         # NPU model — 6.7 t/s on Hailo-10H
  rover_base: https://127.0.0.1:8082         # rover2-api self-call for tool execution (HTTPS, self-signed)
  ollama_timeout_s: 180
  warmup_on_start: true                      # ping hailo-ollama at startup
  fallback_to_cpu: true                      # fall back to localhost:11434 if hailo-ollama unavailable

metrics:
  interval_s: 5
  interval_hot_s: 15                  # slower sampling when CPU >= 70% (less Pi heat)

vlm:
  enabled: true
  hef_path: /opt/rover/models/Qwen2-VL-2B-Instruct.hef
  hailo_group_id: rover2          # must match body_tracker — enables round-robin sharing
  camera_url: http://127.0.0.1:8081/snapshot
  max_tokens: 128                 # keep responses short; longer = more Hailo time

camera_idle:
  enabled: true
  sleep_after_idle_s: 90     # seconds of stable ultrasonic before sleeping
  distance_variance_cm: 8    # cm range threshold for "stable" (max-min in window)
  window_size: 10            # number of readings in sliding window

audio_routing:
  flip6_ip: "192.168.250.1"      # Galaxy Z Flip6 hotspot gateway IP
  a32_ip: "192.168.250.2"        # Samsung Galaxy A32 IP on hotspot subnet
  udp_audio_port: 8085           # UDP port for raw PCM audio frames
  default_mode: "ROVER_A32"      # ROVER_A32 or BUDS
  tts_voice_en: "en_GB-cori-high"    # preferred English TTS voice (Piper)

tts:
  length_scale: 1.05        # slightly slower than default (1.0); cori-high sounds natural here
  sox_enabled: false        # optional: pipe WAV through sox for EQ/normalise (adds ~0.3s latency)
  sox_effects: "norm -3 rate 22050"   # sox effect chain applied when sox_enabled=true

hailo_ollama:
  host: "http://localhost:8000"
  model: "qwen2.5-instruct:1.5b"
  enabled: true
  fallback_to_cpu: true        # fall back to localhost:11434 if hailo-ollama unavailable
  num_predict: 120             # enough for 2-4 spoken sentences
  temperature: 0.65            # lower = closer to few-shot examples; 0.85 too noisy for 1.5B

guard:
  enabled: false                      # master switch — off by default, zero impact when disabled
  rssi_present_threshold: -70         # dBm — above = owner present, stay DISARMED
  rssi_leaving_debounce_s: 10.0       # seconds below threshold before arming
  rssi_return_threshold: -65          # dBm — above = owner returned, disarm
  intruder_confidence: 0.55           # YOLO min confidence to trigger alert (higher than follow)
  alert_hold_s: 30                    # seconds to hold ALERT before returning to ARMED
  speak_on_state_change: true         # ROVER announces arm/disarm/intruder via TTS
  ha_base_url: ""                     # e.g. "http://192.168.225.10:8123" — empty = skip webhooks
  ha_token: ""                        # Long-lived HA access token — never logged or exposed
  webhook_intruder_id: "rover_intruder"
  webhook_armed_id: "rover_armed"
  webhook_disarmed_id: "rover_disarmed"

memory_watchdog:
  target_mb: 300
  warn_mb: 280
  critical_mb: 400
  emergency_mb: 450
  warn_cooldown_s: 1800    # alert at most every 30 min at warn level
  critical_cooldown_s: 300 # alert every 5 min at critical level

watchdog:
  enabled: true
  check_interval_s: 60     # idle check interval
  memory_warn_mb: 420      # log warning only
  memory_critical_mb: 500  # action: restart ollama
  temp_warn_c: 78          # log warning only
  temp_critical_c: 85      # action: disable tracking
  action_window_s: 3600    # 1-hour window for max_actions counter
  max_actions: 3           # after 3 actions: halt auto-fix, speak alert

firmware:
  hex_path: /tmp/rover2_firmware.hex
